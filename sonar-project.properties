sonar.projectKey=skills
sonar.projectName=skills
sonar.sourceEncoding=UTF-8

sonar.sources=scripts,skills,tools,.github
sonar.tests=tests,tools/quillbind/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/.cache/**,**/.venv/**,**/coverage/**,**/test-results/**,**/playwright-report/**,**/ci-output/**,**/__pycache__/**,tools/quillbind/tests/**,tools/quillbind/examples/**,tools/quillbind/third-party/**,tools/quillbind/standards/**,**/*.d.ts
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/.cache/**,**/.venv/**,**/__pycache__/**

sonar.python.version=3.10
sonar.typescript.tsconfigPaths=tools/quillbind/tsconfig.json
sonar.javascript.lcov.reportPaths=tools/quillbind/dist/coverage/lcov.info

# Documented standard/runtime false positives scoped to single rule + single file:
# - xmlns: W3C/IDPF/DAISY/NDL/LOC XML namespaces and EPUB algorithm URIs must use http://
# - xmldomRemove: @xmldom/xmldom does not implement ChildNode.remove() (centralized in removeNode)
# - dohPin: intentional 8.8.8.8 Google Public DNS DoH pin for VPN Fake-IP bypass
# - dockerPin: tag+digest base image pins enforced by scripts/check-locks.ts
# - dockerQaRoot: ephemeral offline CI QA container runs root for package/font install and /out mount
sonar.issue.ignore.multicriteria=xmlns,xmldomRemove,dohPin,dockerPin,dockerQaRoot
sonar.issue.ignore.multicriteria.xmlns.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.xmlns.resourceKey=tools/quillbind/packages/core/src/xml.ts
sonar.issue.ignore.multicriteria.xmldomRemove.ruleKey=typescript:S7762
sonar.issue.ignore.multicriteria.xmldomRemove.resourceKey=tools/quillbind/packages/core/src/xml.ts
sonar.issue.ignore.multicriteria.dohPin.ruleKey=typescript:S1313
sonar.issue.ignore.multicriteria.dohPin.resourceKey=tools/quillbind/packages/core/src/novel-http.ts
sonar.issue.ignore.multicriteria.dockerPin.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.dockerPin.resourceKey=tools/quillbind/Dockerfile.qa
sonar.issue.ignore.multicriteria.dockerQaRoot.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.dockerQaRoot.resourceKey=tools/quillbind/Dockerfile.qa
